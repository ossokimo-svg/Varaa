<!-- JAVASCRIPT: Hanterar endast Netlify-skickning -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const forms = document.querySelectorAll(".signup");
  forms.forEach(form => {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const emailInput = form.querySelector("input[type='email']");
      const msg = form.querySelector(".signup__msg");
      
      if (emailInput && emailInput.value.trim() !== "") {
        const formData = new FormData(form);
        fetch("/", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams(formData).toString()
        })
        .then(() => {
          if (msg) {
            msg.textContent = "Thank you! You are now added to the queue.";
            msg.style.color = "var(--mint, #2d5a3b)";
          }
          form.reset();
        })
        .catch((error) => {
          if (msg) {
            msg.textContent = "Something went wrong. Please try again.";
            msg.style.color = "red";
          }
        });
      }
    });
  });
});
</script>
